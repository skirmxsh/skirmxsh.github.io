---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
    </p>
    {% if page.tags and page.tags.size > 0 %}
      <div class="post-tags">
        {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      </div>
    {% endif %}
  </header>

  {% if page.image %}
    <img class="post-hero" src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}">
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <p class="back-link"><a href="{{ '/' | relative_url }}"><b>&larr; Back to all posts</b></a></p>
</article>
