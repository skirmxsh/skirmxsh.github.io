<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="dark">
  {% include head.html %}
  <body>
    {% include header.html %}

    <main class="wrap site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>&copy; {{ 'now' | date: "%Y" }} | {{ site.author | default: site.title }}</p>
        <div class="social">
          {% if site.github_username %}
          <a href="https://github.com/{{ site.github_username }}" class="social-link"
             aria-label="GitHub" title="GitHub" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
              <path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.76.41-1.27.74-1.56-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.42.36.8 1.08.8 2.18v3.23c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/>
            </svg>
          </a>
          {% endif %}
          {% if site.twitter_username %}
          <a href="https://x.com/{{ site.twitter_username }}" class="social-link"
             aria-label="X" title="X" target="_blank" rel="noopener">
            <svg viewBox="-0.5 -0.5 24 24" width="19" height="19" aria-hidden="true" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.66l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
            </svg>
          </a>
          {% endif %}
          <a href="{{ '/feed.xml' | relative_url }}" class="social-link"
             aria-label="RSS feed" title="RSS feed">
            <svg viewBox="2.5 4.0 17 17" width="18" height="18" aria-hidden="true" fill="currentColor">
              <path d="M4 11a9 9 0 0 1 9 9h-2.5A6.5 6.5 0 0 0 4 13.5V11zm0-5a14 14 0 0 1 14 14h-2.5A11.5 11.5 0 0 0 4 8.5V6zm2 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
            </svg>
          </a>
        </div>
      </div>
    </footer>

    <script src="{{ '/assets/js/search.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/code-copy.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/search-toggle.js' | relative_url }}"></script>
  </body>
</html>
