<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">Home</a>

    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/posts/' | relative_url }}"
         class="{% if page.url contains 'posts' %}active{% endif %}">All Posts</a>
      <a href="{{ '/about/' | relative_url }}"
         class="{% if page.url contains 'about' %}active{% endif %}">About</a>
    </nav>

    <div class="header-tools">
      <div class="search" role="search">
        <input type="text" id="search-input" autocomplete="off"
               placeholder="Search posts…" aria-label="Search posts">
        <ul id="search-results" class="search-results" aria-live="polite"></ul>
      </div>

      <button id="theme-toggle" class="theme-toggle" type="button"
              aria-label="Toggle dark and light mode" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="12" y1="1.5" x2="12" y2="4.5"/>
            <line x1="12" y1="19.5" x2="12" y2="22.5"/>
            <line x1="1.5" y1="12" x2="4.5" y2="12"/>
            <line x1="19.5" y1="12" x2="22.5" y2="12"/>
            <line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/>
            <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/>
            <line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/>
            <line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/>
          </g>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
  </div>
</header>
