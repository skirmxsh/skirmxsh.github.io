<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a1b">

  <title>
    {%- if page.title -%}{{ page.title | escape }} | {{ site.title | escape }}
    {%- else -%}{{ site.title | escape }}{%- endif -%}
  </title>

  <!-- Favicon -->
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon.svg' | relative_url }}">

  <!-- Fonts: Inter (body) + JetBrains Mono (code / wordmark) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}"
        href="{{ '/feed.xml' | relative_url }}">

  {%- seo -%}
  {%- feed_meta -%}

  <!-- Default social card when a page/post has no raster image of its own -->
  {% assign _img = page.image %}
  {% if _img == nil or _img contains '.svg' %}
    <meta property="og:image" content="{{ '/assets/images/og-default.png' | absolute_url }}">
    <meta name="twitter:image" content="{{ '/assets/images/og-default.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
  {% endif %}

  <!-- Apply saved theme before paint to avoid a flash of the wrong mode -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved || (prefersLight ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
